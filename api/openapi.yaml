        "description": "权限：admin。按删除时间与 ID 倒序分页，每页 20 条；仅返回已发布文章或本人的草稿。",
        "security": [
          {
            "sessionCookie": []
          },
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "上一页 next_cursor，原样回传"
          }
        ],
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "items",
                    "next_cursor"
                  ],
                  "properties": {
                    "items": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "required": [
                          "id",
                          "title",
                          "deleted_at"
                        ],
                        "properties": {
                          "id": {
                            "type": "string"
                          },
                          "title": {
                            "type": "string"
                          },
                          "deleted_at": {
                            "type": "string"
                          }
                        }
                      }
                    },
                    "next_cursor": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "输入无效",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "需要登录",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "无操作权限或 CSRF 校验失败",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "不存在或不可读",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "版本冲突或资源状态冲突",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "超出大小限制",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "恢复版本包含已删除标签",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "配额或频率限制",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "operationId": "listTrash",
        "tags": [
          "articles"
        ]
      }
    },
    "/account/avatar": {
      "post": {
        "operationId": "uploadOwnAvatar",
        "summary": "设置本人方形头像",
        "description": "权限：read。所有登录成员均可使用，不授予文章编辑权限。上传 PNG/JPEG/WebP 原图，最多 2 MiB 和 400 万像素；服务器居中裁切、缩放为 256×256 PNG 并去除元数据。头像媒体只对登录成员可见。",
        "security": [
          {
            "sessionCookie": []
          },
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "image/png": {
              "schema": {
                "type": "string",
                "format": "binary"
              }
            },
            "image/jpeg": {
              "schema": {
                "type": "string",
                "format": "binary"
              }
            },
            "image/webp": {
              "schema": {
                "type": "string",
                "format": "binary"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "头像已更新",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "avatar_media_id"
                  ],
                  "properties": {
                    "avatar_media_id": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "图片类型或尺寸不符",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "需要登录",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "无操作权限或 CSRF 失败",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "原图超过 2 MiB",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "delete": {
        "operationId": "removeOwnAvatar",
        "summary": "恢复本人默认头像",
        "description": "权限：read。修改当前头像引用，不改变角色或历史修改人。",
        "security": [
          {
            "sessionCookie": []
          },
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "已恢复默认头像"
          },
          "401": {
            "description": "需要登录",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "无操作权限或 CSRF 失败",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "wiki_session"
      },
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            }
          }
        }
      },
      "User": {
        "type": "object",
        "required": [
          "id",
          "name",
          "login",
          "role",
          "can_edit"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "login": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "system_admin",
              "admin",
              "user"
            ]
          },
          "can_edit": {
            "type": "boolean"
          },
          "avatar_media_id": {
            "type": "string",
            "description": "当前头像的私有媒体 ID，未设置时省略"
          }
        }
      },
      "Mark": {
        "type": "object",
        "required": [
          "type"
        ],
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "bold",
              "italic",
              "strike",
              "code",
              "underline",
              "link"
            ]
          },
          "attrs": {
            "type": "object",
            "properties": {
              "href": {
                "type": "string"
              }
            }
          }
        }
      },
      "DocNode": {
        "type": "object",
        "required": [
          "type"
        ],
        "description": "受控富文本节点。段落有稳定 attrs.id；媒体使用 attrs.mediaId；内部链接 href=/articles/{id}。渲染器不执行原始 HTML。",
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "doc",
              "paragraph",
              "text",
              "heading",
              "bulletList",
              "orderedList",
              "listItem",
              "blockquote",
              "hardBreak",
              "horizontalRule",
              "codeBlock",
              "image",
              "video"
            ]
          },
          "text": {
            "type": "string"
          },
          "attrs": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string"
              },
              "level": {
                "type": "integer",
                "minimum": 1,
                "maximum": 3
              },
              "mediaId": {
                "type": "string"
              },
              "alt": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "start": {
                "type": "integer"
              },
              "src": {
                "type": "string",
                "writeOnly": true,
                "description": "兼容编辑器输入，服务端移除，不作为存储引用"
              }
            }
          },
          "content": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/DocNode"
            }
          },
          "marks": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Mark"
            }
          }
        }
      },
      "TagWrite": {
        "type": "object",
        "required": [
          "name"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 40
          },
          "description": {
            "type": "string",
            "maxLength": 300
          },
          "show_in_nav": {
            "type": "boolean"
          },
          "nav_order": {
            "type": "integer"
          }
        }
      },
      "Tag": {
        "allOf": [
          {
            "$ref": "#/components/schemas/TagWrite"
          },
          {
            "type": "object",
            "required": [
              "id",
              "count"
            ],
            "properties": {
              "id": {
                "type": "string"
              },
              "count": {
                "type": "integer"
              }
            }
          }
        ]
      },
      "ArticleWrite": {
        "type": "object",
        "required": [
          "title",
          "document",
          "expected_revision"
        ],
        "properties": {
          "title": {
            "type": "string",
            "maxLength": 200
          },
          "document": {
            "$ref": "#/components/schemas/DocNode"
          },
          "tag_ids": {
            "type": "array",
            "maxItems": 30,
            "uniqueItems": true,
            "items": {
              "type": "string"
            }
          },
          "occurred_at": {
            "type": "string",
            "description": "空字符串、YYYY、YYYY-MM 或 YYYY-MM-DD；必须为有效日历日期"
          },
          "date_precision": {
            "type": "string",
            "enum": [
              "",
              "year",
              "month",
              "day"
            ]
          },
          "change_summary": {
            "type": "string",
            "maxLength": 1000
          },
          "expected_revision": {
            "type": "integer",
            "minimum": 0
          },
          "status": {
            "type": "string",
            "enum": [
              "draft",
              "published"
            ],
            "default": "published"
          }
        }
      },
      "Article": {
        "type": "object",
        "required": [
          "id",
          "title",
          "document",
          "revision",
          "tags"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "plain_text": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "occurred_at": {
            "type": "string"
          },
          "date_precision": {
            "type": "string"
          },
          "author_id": {
            "type": "string"
          },
          "author_name": {
            "type": "string"
          },
          "updated_by": {
            "type": "string"
          },
          "updated_by_name": {
            "type": "string"
          },
          "created_at": {
            "type": "string"
          },
          "updated_at": {
            "type": "string"
          },
          "change_summary": {
            "type": "string"
          },
          "deleted_at": {
            "type": "string"
          },
          "schema_version": {
            "type": "integer",
            "const": 1
          },
          "revision": {
            "type": "integer"
          },
          "document": {
            "$ref": "#/components/schemas/DocNode"
          },
          "tags": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Tag"
            }
          },
          "media_kinds": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "image",
                "video"
              ]
            }
          },
          "updated_by_avatar": {
            "type": "string",
            "description": "当前头像的私有媒体 ID，未设置时省略"
          }
        }
      },
      "Media": {
        "type": "object",
        "required": [
          "id",
          "name",
          "content_type",
          "size",
          "state"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "content_type": {
            "type": "string"
          },
          "created_at": {
            "type": "string"
          },
          "checksum": {
            "type": "string"
          },
          "size": {
            "type": "integer",
            "format": "int64"
          },
          "state": {
            "type": "string",
            "enum": [
              "pending",
              "uploaded",
              "ready",
              "cancelled",
              "expired"
            ]
          }
        }
      },
      "OK": {
        "type": "object",
        "properties": {
          "ok": {
            "type": "boolean"
          }
        }
      },
      "Session": {
        "type": "object",
        "properties": {
          "user": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/User"
              },
              {
                "type": "null"
              }
            ]
          },
          "csrf_token": {
            "type": "string"
          },
          "demo": {
            "type": "boolean"
          },
          "setup_needed": {
            "type": "boolean"
          },
          "public_read": {
            "type": "boolean"
          }
        }
      },
      "ArticleSummary": {
        "type": "object",
        "required": [
          "id",
          "title",
          "revision",
          "tags"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "plain_text": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "occurred_at": {
            "type": "string"
          },
          "date_precision": {
            "type": "string"
          },
          "author_id": {
            "type": "string"
          },
          "author_name": {
            "type": "string"
          },
          "updated_by": {
            "type": "string"
          },
          "updated_by_name": {
            "type": "string"
          },
          "created_at": {
            "type": "string"
          },
          "updated_at": {
            "type": "string"
          },
          "change_summary": {
            "type": "string"
          },
          "deleted_at": {
            "type": "string"
          },
          "schema_version": {
            "type": "integer",
            "const": 1
          },
          "revision": {
            "type": "integer"
          },
          "tags": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Tag"
            }
          },
          "media_kinds": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "image",
                "video"
              ]
            }
          }
        }
      },
      "Member": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "login": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "system_admin",
              "admin",
              "user"
            ]
          },
          "disabled": {
            "type": "boolean"
          },
          "can_edit": {
            "type": "boolean"
          }
        }
      }
    }
  },
  "tags": [
    {
      "name": "Accounts",
      "description": "私有成员与验证码"
    }
  ]
}
