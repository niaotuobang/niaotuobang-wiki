          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            }
          }
        }
      },
      "User": {
        "type": "object",
        "required": [
          "id",
          "name",
          "login",
          "role"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "login": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "admin",
              "editor",
              "viewer"
            ]
          }
        }
      },
      "Mark": {
        "type": "object",
        "required": [
          "type"
        ],
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "bold",
              "italic",
              "strike",
              "code",
              "underline",
              "link"
            ]
          },
          "attrs": {
            "type": "object",
            "properties": {
              "href": {
                "type": "string"
              }
            }
          }
        }
      },
      "DocNode": {
        "type": "object",
        "required": [
          "type"
        ],
        "description": "受控富文本节点。段落有稳定 attrs.id；媒体使用 attrs.mediaId；内部链接 href=/articles/{id}。渲染器不执行原始 HTML。",
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "doc",
              "paragraph",
              "text",
              "heading",
              "bulletList",
              "orderedList",
              "listItem",
              "blockquote",
              "hardBreak",
              "horizontalRule",
              "codeBlock",
              "image",
              "video"
            ]
          },
          "text": {
            "type": "string"
          },
          "attrs": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string"
              },
              "level": {
                "type": "integer",
                "minimum": 1,
                "maximum": 3
              },
              "mediaId": {
                "type": "string"
              },
              "alt": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "start": {
                "type": "integer"
              },
              "src": {
                "type": "string",
                "writeOnly": true,
                "description": "兼容编辑器输入，服务端移除，不作为存储引用"
              }
            }
          },
          "content": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/DocNode"
            }
          },
          "marks": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Mark"
            }
          }
        }
      },
      "TagWrite": {
        "type": "object",
        "required": [
          "name"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 40
          },
          "description": {
            "type": "string",
            "maxLength": 300
          },
          "show_in_nav": {
            "type": "boolean"
          },
          "nav_order": {
            "type": "integer"
          }
        }
      },
      "Tag": {
        "allOf": [
          {
            "$ref": "#/components/schemas/TagWrite"
          },
          {
            "type": "object",
            "required": [
              "id",
              "count"
            ],
            "properties": {
              "id": {
                "type": "string"
              },
              "count": {
                "type": "integer"
              }
            }
          }
        ]
      },
      "ArticleWrite": {
        "type": "object",
        "required": [
          "title",
          "document",
          "expected_revision"
        ],
        "properties": {
          "title": {
            "type": "string",
            "maxLength": 200
          },
          "document": {
            "$ref": "#/components/schemas/DocNode"
          },
          "tag_ids": {
            "type": "array",
            "maxItems": 30,
            "uniqueItems": true,
            "items": {
              "type": "string"
            }
          },
          "occurred_at": {
            "type": "string",
            "description": "空字符串、YYYY、YYYY-MM 或 YYYY-MM-DD；必须为有效日历日期"
          },
          "date_precision": {
            "type": "string",
            "enum": [
              "",
              "year",
              "month",
              "day"
            ]
          },
          "change_summary": {
            "type": "string",
            "maxLength": 1000
          },
          "expected_revision": {
            "type": "integer",
            "minimum": 0
          },
          "status": {
            "type": "string",
            "enum": [
              "draft",
              "published"
            ],
            "default": "published"
          }
        }
      },
      "Article": {
        "type": "object",
        "required": [
          "id",
          "title",
          "document",
          "revision",
          "tags"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "plain_text": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "occurred_at": {
            "type": "string"
          },
          "date_precision": {
            "type": "string"
          },
          "author_id": {
            "type": "string"
          },
          "author_name": {
            "type": "string"
          },
          "updated_by": {
            "type": "string"
          },
          "updated_by_name": {
            "type": "string"
          },
          "created_at": {
            "type": "string"
          },
          "updated_at": {
            "type": "string"
          },
          "change_summary": {
            "type": "string"
          },
          "deleted_at": {
            "type": "string"
          },
          "schema_version": {
            "type": "integer",
            "const": 1
          },
          "revision": {
            "type": "integer"
          },
          "document": {
            "$ref": "#/components/schemas/DocNode"
          },
          "tags": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Tag"
            }
          },
          "media_kinds": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "image",
                "video"
              ]
            }
          }
        }
      },
      "Media": {
        "type": "object",
        "required": [
          "id",
          "name",
          "content_type",
          "size",
          "state"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "content_type": {
            "type": "string"
          },
          "created_at": {
            "type": "string"
          },
          "checksum": {
            "type": "string"
          },
          "size": {
            "type": "integer",
            "format": "int64"
          },
          "state": {
            "type": "string",
            "enum": [
              "pending",
              "uploaded",
              "ready",
              "cancelled",
              "expired"
            ]
          }
        }
      },
      "OK": {
        "type": "object",
        "properties": {
          "ok": {
            "type": "boolean"
          }
        }
      },
      "Session": {
        "type": "object",
        "properties": {
          "user": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/User"
              },
              {
                "type": "null"
              }
            ]
          },
          "csrf_token": {
            "type": "string"
          },
          "demo": {
            "type": "boolean"
          },
          "setup_needed": {
            "type": "boolean"
          },
          "public_read": {
            "type": "boolean"
          }
        }
      },
      "ArticleSummary": {
        "type": "object",
        "required": [
          "id",
          "title",
          "revision",
          "tags"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "plain_text": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "occurred_at": {
            "type": "string"
          },
          "date_precision": {
            "type": "string"
          },
          "author_id": {
            "type": "string"
          },
          "author_name": {
            "type": "string"
          },
          "updated_by": {
            "type": "string"
          },
          "updated_by_name": {
            "type": "string"
          },
          "created_at": {
            "type": "string"
          },
          "updated_at": {
            "type": "string"
          },
          "change_summary": {
            "type": "string"
          },
          "deleted_at": {
            "type": "string"
          },
          "schema_version": {
            "type": "integer",
            "const": 1
          },
          "revision": {
            "type": "integer"
          },
          "tags": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Tag"
            }
          },
          "media_kinds": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "image",
                "video"
              ]
            }
          }
        }
      },
      "Member": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "login": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "admin",
              "editor",
              "viewer"
            ]
          },
          "disabled": {
            "type": "boolean"
          }
        }
      }
    }
  }
}
