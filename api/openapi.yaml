    "/articles": {
      "get": {
        "summary": "文章列表与中文子串搜索",
        "description": "默认 20 条，最多 50 条。列表不返回正文 JSON，plain_text 为摘要；按更新时间和 ID 稳定排序，搜索优先匹配标题。公开阅读由管理员显式开启。",
        "security": [
          {
            "sessionCookie": []
          },
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": ""
          },
          {
            "name": "tag",
            "in": "query",
            "schema": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "description": "多个 Tag 取交集"
