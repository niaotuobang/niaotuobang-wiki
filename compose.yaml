services:
  wiki:
    image: niaotuobang-wiki:local
    build: .
    env_file:
      - ${WIKI_ENV_FILE:?Set WIKI_ENV_FILE to a private runtime env file}
    environment:
      DATA_DIR: /data
      LISTEN_ADDR: 0.0.0.0:8080
      AUTH_SECRET_FILE: /run/secrets/wiki-auth
    secrets:
      - wiki-auth
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - wiki-data:/data
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
volumes:
  wiki-data:
secrets:
  wiki-auth:
    file: ${WIKI_AUTH_SECRET_FILE:?Set WIKI_AUTH_SECRET_FILE to the private 32-byte key file}
